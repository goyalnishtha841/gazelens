<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,300..500,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind via CDN, exact same approach + config as the Stitch exports --
         so every className used in the ported screens works with zero translation. -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container": "#e8efec",
              error: "#ba1a1a",
              "on-primary": "#ffffff",
              "on-primary-fixed": "#001f23",
              "inverse-surface": "#2b3230",
              "surface-container-lowest": "#ffffff",
              background: "#F6F7F5",
              "on-tertiary-fixed-variant": "#6b3a13",
              "on-primary-fixed-variant": "#004f56",
              "on-tertiary-container": "#ffddc7",
              "on-secondary-fixed": "#151d1a",
              "surface-variant": "#dde4e1",
              outline: "#D1D5D2",
              "tertiary-fixed": "#ffdcc5",
              "inverse-on-surface": "#ebf2ef",
              "surface-tint": "#146871",
              "secondary-container": "#dbe5df",
              "inverse-primary": "#8ad2dc",
              "tertiary-container": "#8f582e",
              "surface-dim": "#d4dcd8",
              "tertiary-fixed-dim": "#feb785",
              secondary: "#57605c",
              primary: "#00565e",
              "on-secondary-fixed-variant": "#404945",
              "on-secondary": "#ffffff",
              "on-secondary-container": "#5d6662",
              "on-surface": "#161d1b",
              "primary-fixed-dim": "#8ad2dc",
              "on-error-container": "#93000a",
              tertiary: "#734119",
              "surface-container-highest": "#dde4e1",
              "secondary-fixed-dim": "#bfc9c4",
              "on-primary-container": "#1F6F78",
              "primary-fixed": "#a6eef9",
              surface: "#F6F7F5",
              "secondary-fixed": "#dbe5df",
              "on-error": "#ffffff",
              "on-surface-variant": "#3f484a",
              "surface-container-low": "#EFF0ED",
              "on-tertiary": "#ffffff",
              "primary-container": "#1F6F78",
              "on-tertiary-fixed": "#301400",
              "error-container": "#F6E6E4",
              "surface-bright": "#F6F7F5",
              "surface-container-high": "#e3eae6",
              "outline-variant": "#bec8ca",
              "on-background": "#161d1b",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            spacing: {
              gutter: "24px",
              "container-max": "1440px",
              "margin-desktop": "40px",
              unit: "4px",
              "margin-mobile": "16px",
            },
            fontFamily: {
              "headline-md": ['"Source Serif 4"'],
              "data-mono": ["JetBrains Mono"],
              "body-md": ["Inter"],
              "body-lg": ["Inter"],
              "headline-sm": ['"Source Serif 4"'],
              "label-caps": ["Inter"],
              "display-lg": ['"Source Serif 4"'],
            },
            fontSize: {
              "headline-md": ["28px", { lineHeight: "36px", fontWeight: "500" }],
              "data-mono": ["13px", { lineHeight: "18px", fontWeight: "400" }],
              "body-md": ["15px", { lineHeight: "24px", fontWeight: "400" }],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "500" }],
              "label-caps": ["11px", { lineHeight: "16px", letterSpacing: "0.08em", fontWeight: "600" }],
              "display-lg": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "600" }],
            },
          },
        },
      };
    </script>

    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .entrance-animation {
        animation: entrance 400ms ease-out forwards;
      }
      @keyframes entrance {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      input:focus {
        outline: none;
        border-width: 2px !important;
        border-color: #1F6F78 !important;
      }
      button:active {
        transform: scale(0.98);
      }
      .loading-spinner {
        border: 2px solid #ffffff33;
        border-top: 2px solid #ffffff;
        border-radius: 50%;
        width: 16px;
        height: 16px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .stagger-item:nth-child(1) { animation-delay: 0ms; }
      .stagger-item:nth-child(2) { animation-delay: 40ms; }
      .stagger-item:nth-child(3) { animation-delay: 80ms; }
      .stagger-item:nth-child(4) { animation-delay: 120ms; }
      .stagger-item:nth-child(5) { animation-delay: 160ms; }
      .stagger-item:nth-child(6) { animation-delay: 200ms; }
      .stagger-item:nth-child(7) { animation-delay: 240ms; }
      .stagger-item:nth-child(8) { animation-delay: 280ms; }
    </style>

    <title>GazeLens</title>
  </head>
  <body class="bg-background text-on-surface font-body-md text-body-md">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
