name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each suite is plain scripts (test_*.py) run from inside its folder.
        suite: [agents, api, attribution, calibration, cv, gaze_estimation, render]
    env:
      # A throwaway key so no test writes backend/api/.secret_key.
      GAZELENS_SECRET_KEY: ci-only-key-not-for-deployment-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgles2 libegl1
          pip install -r requirements-dev.txt
          pip install --no-deps rapidocr-onnxruntime==1.4.4

      - name: Install Chromium (page capture + PDF)
        if: matrix.suite == 'render' || matrix.suite == 'api'
        run: playwright install --with-deps chromium

      - name: Fetch MediaPipe face landmarker
        if: matrix.suite == 'cv' || matrix.suite == 'api'
        run: python scripts/fetch_face_landmarker.py

      - name: Run ${{ matrix.suite }} tests
        working-directory: backend/${{ matrix.suite }}
        run: |
          for t in test_*.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done

  e2e:
    name: end-to-end (API + web app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgles2 libegl1
          pip install -r requirements-dev.txt
          pip install --no-deps rapidocr-onnxruntime==1.4.4
          playwright install --with-deps chromium
          npm ci --prefix frontend-new

      # Starts its own API + web app on throwaway data, runs every flow
      # (sample page, live URLs, PDF, security, crash recovery), shuts down.
      - name: Run end-to-end check
        run: python scripts/e2e_check.py --web

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend/ scripts/ --select F,E9,B,A

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json
      - run: npm ci
      - run: npm run build

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image Render deploys -- catch a broken build here, not on deploy.
      - name: Build API image
        run: docker build -f backend/Dockerfile -t gazelens-api .
