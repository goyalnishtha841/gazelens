name: Deploy API to Hugging Face

# Pushes the backend to a Hugging Face Docker Space, which builds
# backend/Dockerfile and serves it over HTTPS (free CPU tier, no card).
#
# One-time setup (see DEPLOY.md):
#   repo variable  HF_SPACE  = <hf-username>/<space-name>, e.g. nishtha/gazelens-api
#   repo secret    HF_TOKEN  = a Hugging Face access token with write access
# Until HF_SPACE is set this workflow skips itself.

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - test_uis/**
      - models/__init__.py
      - scripts/fetch_face_landmarker.py
      - requirements-server.txt
      - deploy/huggingface/**
      - .github/workflows/deploy-hf.yml
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only what backend/Dockerfile needs, at the same paths, with the
      # Dockerfile at the root where Spaces looks for it. git archive so only
      # tracked files go out -- never local data or keys.
      - name: Assemble the Space
        run: |
          mkdir space
          git archive HEAD \
            backend test_uis models/__init__.py \
            scripts/fetch_face_landmarker.py requirements-server.txt .dockerignore \
            | tar -x -C space
          cp backend/Dockerfile space/Dockerfile
          cp deploy/huggingface/README.md space/README.md

      - name: Push to ${{ vars.HF_SPACE }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Repository secret HF_TOKEN is not set (see DEPLOY.md)."
            exit 1
          fi
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          # Force: the Space is a build target, GitHub is the source of truth.
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Pushed. Build progress: https://huggingface.co/spaces/${HF_SPACE}"
