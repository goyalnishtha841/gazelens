<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dashboard Page -- GazeLens test page</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; font-family:-apple-system,Inter,Helvetica,Arial,sans-serif; background:#F5F5F2; overflow:hidden; }
  #gl-page { position:relative; width:100%; height:100%; }
</style>
</head>
<body>
  <div id="gl-page">
    <div id="nav_menu" class="gl-element" style="position:absolute; left:5.0000%; top:3.0000%; width:90.0000%; height:6.0000%; background:#00565E; color:#fff; display:flex; align-items:center; padding:0 24px; gap:32px; font-weight:600; font-size:14px; letter-spacing:.04em;">
      <span>GazeOps</span><span>Overview</span><span>Reports</span><span>Settings</span>
    </div>
    <div id="chart_widget" class="gl-element" style="position:absolute; left:5.0000%; top:13.0000%; width:55.0000%; height:48.0000%; background:#E4E7E4; display:flex; align-items:center; justify-content:center; color:#8A938E; font-size:14px; border:1px solid #D6DAD6;">
      Weekly usage chart
    </div>
    <div id="sidebar_ad" class="gl-element" style="position:absolute; left:65.0000%; top:13.0000%; width:30.0000%; height:14.0000%; background:#F0F1EE; border:1px dashed #C7CCC8; display:flex; align-items:center; justify-content:center; color:#8A938E; font-size:13px; box-sizing:border-box;">
      Upgrade to Pro
    </div>
    <div id="promo_widget" class="gl-element" style="position:absolute; left:65.0000%; top:31.0000%; width:30.0000%; height:14.0000%; background:#F0F1EE; border:1px dashed #C7CCC8; display:flex; align-items:center; justify-content:center; color:#8A938E; font-size:13px; box-sizing:border-box;">
      3 new integrations available
    </div>
    <div id="help_icon" class="gl-element" style="position:absolute; left:87.0000%; top:3.0000%; width:8.0000%; height:5.0000%; background:#F0F1EE; border:1px dashed #C7CCC8; display:flex; align-items:center; justify-content:center; color:#8A938E; font-size:13px; box-sizing:border-box;">
      ?
    </div>
    <div id="cta_primary" class="gl-element" style="position:absolute; left:5.0000%; top:66.0000%; width:25.0000%; height:9.0000%; background:#1F6F78; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; letter-spacing:.03em; border-radius:4px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.15);">
      New report
    </div>
    <div id="cta_secondary" class="gl-element" style="position:absolute; left:33.0000%; top:66.0000%; width:25.0000%; height:9.0000%; background:#1F6F78; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; letter-spacing:.03em; border-radius:4px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.15);">
      Invite team
    </div>
    <div id="footer_link" class="gl-element" style="position:absolute; left:5.0000%; top:90.0000%; width:20.0000%; height:4.0000%; background:#fff; padding:12px; box-sizing:border-box; color:#2B2F2C; font-size:14px; line-height:1.5; border:1px solid #E4E7E4; overflow:hidden;">
      Terms &middot; Privacy
    </div>
  </div>
</body>
</html>
