<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Login Page -- GazeLens test page</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; font-family:-apple-system,Inter,Helvetica,Arial,sans-serif; background:#F5F5F2; overflow:hidden; }
  #gl-page { position:relative; width:100%; height:100%; }
</style>
</head>
<body>
  <div id="gl-page">
    <div id="nav_bar" class="gl-element" style="position:absolute; left:5.0000%; top:3.0000%; width:90.0000%; height:8.0000%; background:#00565E; color:#fff; display:flex; align-items:center; padding:0 24px; gap:32px; font-weight:600; font-size:14px; letter-spacing:.04em;">
      <span>GazeLens</span><span>Product</span><span>Docs</span><span>Support</span>
    </div>
    <div id="logo" class="gl-element" style="position:absolute; left:40.0000%; top:16.0000%; width:20.0000%; height:8.0000%; background:#E4E7E4; display:flex; align-items:center; justify-content:center; color:#8A938E; font-size:14px; border:1px solid #D6DAD6;">
      GazeLens
    </div>
    <div id="email_field" class="gl-element" style="position:absolute; left:30.0000%; top:28.0000%; width:40.0000%; height:8.0000%; background:#fff; padding:12px; box-sizing:border-box; color:#2B2F2C; font-size:14px; line-height:1.5; border:1px solid #E4E7E4; overflow:hidden;">
      <label style='display:block; font-size:12px; color:#8A938E; margin-bottom:4px;'>Email</label>you@example.com
    </div>
    <div id="password_field" class="gl-element" style="position:absolute; left:30.0000%; top:40.0000%; width:40.0000%; height:8.0000%; background:#fff; padding:12px; box-sizing:border-box; color:#2B2F2C; font-size:14px; line-height:1.5; border:1px solid #E4E7E4; overflow:hidden;">
      <label style='display:block; font-size:12px; color:#8A938E; margin-bottom:4px;'>Password</label>&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;
    </div>
    <div id="forgot_password_link" class="gl-element" style="position:absolute; left:30.0000%; top:50.0000%; width:40.0000%; height:4.0000%; background:#fff; padding:12px; box-sizing:border-box; color:#2B2F2C; font-size:14px; line-height:1.5; border:1px solid #E4E7E4; overflow:hidden;">
      Forgot your password?
    </div>
    <div id="login_button" class="gl-element" style="position:absolute; left:30.0000%; top:58.0000%; width:40.0000%; height:10.0000%; background:#1F6F78; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; letter-spacing:.03em; border-radius:4px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.15);">
      Log in
    </div>
    <div id="signup_link" class="gl-element" style="position:absolute; left:30.0000%; top:72.0000%; width:40.0000%; height:5.0000%; background:#fff; padding:12px; box-sizing:border-box; color:#2B2F2C; font-size:14px; line-height:1.5; border:1px solid #E4E7E4; overflow:hidden;">
      Don't have an account? Create one
    </div>
  </div>
</body>
</html>
