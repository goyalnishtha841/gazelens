<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Form Page -- GazeLens test page</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; font-family:-apple-system,Inter,Helvetica,Arial,sans-serif; background:#F5F5F2; overflow:hidden; }
  #gl-page { position:relative; width:100%; height:100%; }
</style>
</head>
<body>
  <div id="gl-page">
    <div id="promo_banner" class="gl-element" style="position:absolute; left:10.0000%; top:4.0000%; width:80.0000%; height:9.0000%; background:#F0F1EE; border:1px dashed #C7CCC8; display:flex; align-items:center; justify-content:center; color:#8A938E; font-size:13px; box-sizing:border-box;">
      Free shipping on orders over $50 this week only
    </div>
    <div id="name_field" class="gl-element" style="position:absolute; left:20.0000%; top:20.0000%; width:60.0000%; height:9.0000%; background:#fff; padding:12px; box-sizing:border-box; color:#2B2F2C; font-size:14px; line-height:1.5; border:1px solid #E4E7E4; overflow:hidden;">
      <label style='display:block; font-size:12px; color:#8A938E; margin-bottom:4px;'>Full name</label>Jordan Rivera
    </div>
    <div id="email_field" class="gl-element" style="position:absolute; left:20.0000%; top:34.0000%; width:60.0000%; height:9.0000%; background:#fff; padding:12px; box-sizing:border-box; color:#2B2F2C; font-size:14px; line-height:1.5; border:1px solid #E4E7E4; overflow:hidden;">
      <label style='display:block; font-size:12px; color:#8A938E; margin-bottom:4px;'>Email</label>jordan@example.com
    </div>
    <div id="helper_text" class="gl-element" style="position:absolute; left:20.0000%; top:46.0000%; width:60.0000%; height:5.0000%; background:#fff; padding:12px; box-sizing:border-box; color:#2B2F2C; font-size:14px; line-height:1.5; border:1px solid #E4E7E4; overflow:hidden;">
      We'll never share your email with anyone else.
    </div>
    <div id="submit_button" class="gl-element" style="position:absolute; left:35.0000%; top:60.0000%; width:30.0000%; height:10.0000%; background:#1F6F78; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; letter-spacing:.03em; border-radius:4px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.15);">
      Create account
    </div>
  </div>
</body>
</html>
